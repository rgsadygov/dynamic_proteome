---
layout: default
---
<h3>{{ page.title }}</h3>
<p>{{ page.date | date_to_string }} </p>
<div style="text-align: justify;">
    <p class="lead mx-auto ms-4">{{ content }}</p>
</div>

<div class="text-center">
    <img src="{{ page.img | prepend: '/assets/images/'| relative_url }}" class="img-fluid" alt="MassSpectra"
        height="30">
</div>


<a href="{{ page.paper_link }}">{{ page.paper_title }}</a>
